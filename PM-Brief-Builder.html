*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);font-weight:var(--w-light);
  color:var(--chrome-dark);background:var(--chrome-light);
  -webkit-font-smoothing:antialiased;line-height:1.5;
}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--white)}
 
/* ---- Header: Master Blue field, white wordmark ---- */
.head{background:var(--quantum-blue);padding:28px 40px 24px;color:var(--white);position:relative}
.head .ver{position:absolute;top:26px;right:40px;font-size:12px;font-weight:var(--w-semi);letter-spacing:0.04em;color:rgba(255,255,255,.7)}
.head .logo{height:26px;display:block}
.head .logo svg{height:100%;width:auto}
.head .eyebrow{font-weight:var(--w-semi);letter-spacing:var(--ls-label);text-transform:uppercase;font-size:12px;margin-top:20px;opacity:.85}
.head h1{font-family:var(--font-display);font-weight:var(--w-bold);font-size:30px;letter-spacing:var(--ls-display);line-height:1.1;margin-top:6px}
 
/* ---- Pentagon progress (signature device: power of 5) ---- */
.progress{display:flex;gap:10px;align-items:center;padding:18px 40px;background:var(--white);border-bottom:1px solid var(--chrome-dark-20);flex-wrap:wrap}
.pip{width:18px;height:18px;background:var(--chrome-dark-20);
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);transition:background .2s}
.pip.done{background:var(--quantum-blue)}
.pip.active{background:var(--qubit-rose)}
.pip.go{cursor:pointer}
.pip.go:hover{opacity:.7}
.progress .count{margin-left:auto;font-size:12px;letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:var(--w-semi);color:var(--chrome-dark-60)}
 
/* ---- Section body ---- */
.stage{flex:1;padding:40px 40px 120px;display:flex;flex-direction:column}
.sec-eyebrow{font-weight:var(--w-semi);letter-spacing:var(--ls-label);text-transform:uppercase;font-size:12px;color:var(--qubit-rose)}
.sec-eyebrow .req{color:var(--qubit-rose);margin-left:6px}
.question{font-family:var(--font-display);font-weight:var(--w-bold);font-size:32px;letter-spacing:var(--ls-display);line-height:1.1;margin-top:10px;color:var(--chrome-dark)}
.helper{font-size:15px;color:var(--chrome-dark-60);margin-top:10px;max-width:52ch}
.field{margin-top:28px}
 
/* text input with brand-code affix */
.affix{display:flex;align-items:stretch;border:1.5px solid var(--chrome-dark-20);border-radius:var(--radius);overflow:hidden;background:var(--white);transition:border-color .15s}
.affix:focus-within{border-color:var(--quantum-blue)}
.affix .prefix{display:flex;align-items:center;padding:0 14px;background:var(--quantum-blue-20);
  font-weight:var(--w-bold);font-size:16px;color:var(--quantum-blue);white-space:nowrap}
.affix input{border:0;outline:0;flex:1;padding:14px 16px;font-family:var(--font-body);font-size:16px;font-weight:var(--w-reg);color:var(--chrome-dark);background:transparent}
input.plain{width:100%;border:1.5px solid var(--chrome-dark-20);border-radius:var(--radius);padding:14px 16px;font-family:var(--font-body);font-size:16px;font-weight:var(--w-reg);color:var(--chrome-dark);background:var(--white);transition:border-color .15s}
input.plain:focus{outline:0;border-color:var(--quantum-blue)}
textarea.plain{width:100%;border:1.5px solid var(--chrome-dark-20);border-radius:var(--radius);padding:14px 16px;font-family:var(--font-body);font-size:16px;font-weight:var(--w-reg);color:var(--chrome-dark);background:var(--white);transition:border-color .15s;min-height:120px;resize:vertical;line-height:1.5}
textarea.plain:focus{outline:0;border-color:var(--quantum-blue)}
.plain.invalid, .affix.invalid{border-color:var(--qubit-rose)!important;box-shadow:0 0 0 3px var(--qubit-rose-20)}
.choices.invalid{border-radius:var(--radius);box-shadow:0 0 0 3px var(--qubit-rose-20);outline:1.5px solid var(--qubit-rose);outline-offset:2px}
.group-card.invalid{outline:1.5px solid var(--qubit-rose);outline-offset:0}
 
/* compound sub-fields */
.tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--chrome-dark-20)}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;font-weight:var(--w-semi);font-size:15px;color:var(--chrome-dark-60);padding:10px 16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--chrome-dark)}
.tab.on{color:var(--quantum-blue);border-bottom-color:var(--quantum-blue)}
.cta-link{margin-left:auto;align-self:center;margin-bottom:6px;font-family:var(--font-body);letter-spacing:0;line-height:1;font-weight:var(--w-semi);font-size:13px;color:var(--quantum-blue);text-decoration:none;padding:7px 14px;border:1px solid var(--quantum-blue);border-radius:8px;white-space:nowrap;transition:.15s}
.cta-link:hover{background:var(--quantum-blue);color:var(--white)}
.cta-row{display:flex;justify-content:flex-end;margin-bottom:10px}
.cta-row .cta-link{margin-bottom:0}
.question-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.question-cta .cta-link{margin:0;align-self:center}
.group-card{border:1px solid var(--line);border-radius:12px;padding:8px 20px 20px;margin-top:16px;background:#fafbfc;scroll-margin-top:20px}
.group-head{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.group-title{font-weight:var(--w-bold);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--quantum-blue)}
.group-remove{appearance:none;border:0;background:transparent;color:var(--chrome-dark-60);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.group-remove:hover{color:var(--qubit-rose)}
.group-add{appearance:none;margin-top:16px;background:transparent;border:1px dashed #c7cacc;color:var(--quantum-blue);font:inherit;font-weight:var(--w-semi);font-size:14px;padding:13px 18px;border-radius:10px;cursor:pointer;width:100%}
.group-add:hover{background:var(--chrome-light);border-color:var(--quantum-blue)}
.dup-btn{appearance:none;display:block;width:100%;margin:8px 0 14px;padding:15px;background:transparent;border:1.5px dashed var(--quantum-blue-40);border-radius:12px;color:var(--quantum-blue);font:inherit;font-weight:var(--w-semi);font-size:15px;text-align:center;cursor:pointer;transition:.15s}
.dup-btn:hover{background:var(--quantum-blue-20);border-color:var(--quantum-blue)}
.setting-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.setting-row .plain{flex:1;margin:0}
.setting-remove{appearance:none;border:0;background:var(--chrome-light);color:var(--chrome-dark-60);width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.setting-remove:hover{color:var(--qubit-rose)}
.subfield{margin-top:18px}
.subfield:first-child{margin-top:0}
.subfield .slabel{display:block;font-weight:var(--w-semi);font-size:13px;color:var(--chrome-dark);margin-bottom:8px}
.slabel{display:block;font-weight:var(--w-semi);font-size:13px;color:var(--chrome-dark);margin-bottom:8px}
.req{color:var(--qubit-rose);margin-left:2px}
.opt{color:var(--chrome-dark-60);font-weight:var(--w-light);margin-left:4px;font-size:0.85em}
.subhead{font-family:var(--font-display);font-weight:var(--w-bold);font-size:21px;letter-spacing:var(--ls-display);color:var(--chrome-dark);margin-top:34px}
.subhelp{font-size:14px;color:var(--chrome-dark-60);margin-top:6px;margin-bottom:4px}
.vhead{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 0 2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.vhead .chev{width:9px;height:9px;border-right:2px solid var(--chrome-dark-60);border-bottom:2px solid var(--chrome-dark-60);transform:rotate(-45deg);transition:transform .15s;flex:none}
.group-card.open .vhead .chev{transform:rotate(45deg)}
.vbadge{margin-left:auto;font-size:11.5px;font-weight:var(--w-semi);letter-spacing:.03em;text-transform:uppercase}
.vbadge.ok{color:var(--quantum-blue)}
.vbadge.todo{color:var(--qubit-rose)}
.vbody{margin-top:2px}
.pd-mini{margin-top:10px}
 
/* multi-select checkbox indicator */
.choice .box{width:18px;height:18px;border-radius:4px;border:2px solid var(--chrome-dark-40);flex:none;transition:.15s;position:relative}
.choice.sel .box{border-color:var(--quantum-blue);background:var(--quantum-blue)}
.choice.sel .box::after{content:'';position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--white);border-width:0 2px 2px 0;transform:rotate(45deg)}
 
/* choice cards */
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.choice{border:1.5px solid var(--chrome-dark-20);border-radius:var(--radius);padding:16px 18px;cursor:pointer;background:var(--white);transition:border-color .15s,background .15s;display:flex;align-items:center;gap:12px}
.choice:hover{border-color:var(--quantum-blue-40)}
.choice.sel{border-color:var(--quantum-blue);background:var(--quantum-blue-20)}
.choice .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--chrome-dark-40);flex:none;transition:.15s}
.choice.sel .dot{border-color:var(--quantum-blue);background:var(--quantum-blue);box-shadow:inset 0 0 0 3px var(--white)}
.choice .lab{font-weight:var(--w-semi);font-size:16px;color:var(--chrome-dark)}
.choice .lab-wrap{display:flex;flex-direction:column;gap:2px}
.choice .choice-sub{font-size:12px;color:var(--chrome-dark-60);font-weight:var(--w-light);line-height:1.4}
.choice.disabled{opacity:.45;cursor:not-allowed;background:var(--chrome-light);pointer-events:none}
.choice.disabled .dot{border-color:var(--chrome-dark-40)}
.choice .code{font-weight:var(--w-bold);color:var(--quantum-blue);margin-right:2px}
 
/* compact number pills (e.g. 1–5 counts) */
.choices.compact{grid-template-columns:repeat(auto-fill,minmax(64px,72px))}
.choices.compact .choice{justify-content:center;padding:14px 8px}
.choices.compact .dot{display:none}
.choices.compact .lab{font-size:18px;font-weight:var(--w-bold)}
.choices.compact .choice.sel .lab{color:var(--quantum-blue)}
 
.error{color:var(--qubit-rose);font-weight:var(--w-semi);font-size:14px;margin-top:14px;min-height:1.2em}
 
/* asset / SLA calculator */
.calc{margin-top:28px;background:var(--chrome-light);border-radius:var(--radius);padding:20px}
.calc h3{font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:var(--w-semi);color:var(--quantum-blue)}
.calc-empty{font-size:14px;color:var(--chrome-dark-60);margin-top:10px}
.calc-group{font-size:11px;text-transform:uppercase;letter-spacing:var(--ls-label);font-weight:var(--w-semi);color:var(--quantum-blue);margin-top:18px;margin-bottom:2px}
.calc-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--chrome-dark-20)}
.calc-main{flex:1;display:flex;flex-direction:column;gap:2px}
.calc-label{font-weight:var(--w-semi);font-size:15px;color:var(--chrome-dark)}
.calc-detail{font-size:12.5px;color:var(--chrome-dark-60)}
.calc-num{font-weight:var(--w-bold);font-size:18px;color:var(--quantum-blue);min-width:48px;text-align:right}
.calc-subtotal{border-bottom:0;border-top:1px solid var(--chrome-dark-40)}
.calc-subtotal span:first-child{flex:1;font-weight:var(--w-semi);text-transform:uppercase;letter-spacing:var(--ls-label);font-size:11px;color:var(--chrome-dark-60)}
.calc-subtotal .calc-num{color:var(--chrome-dark)}
.calc-total{border-bottom:0;border-top:2px solid var(--quantum-blue);margin-top:6px}
.calc-total span:first-child{flex:1;font-family:var(--font-display);font-weight:var(--w-bold);color:var(--chrome-dark)}
.calc-total .calc-num{font-size:24px}
.calc-timetotal{border-bottom:0;border-top:2px solid var(--quantum-blue);margin-top:6px}
.calc-timetotal span:first-child{flex:1;font-weight:var(--w-bold);font-size:15px;color:var(--chrome-dark)}
.calc-timetotal .calc-num{font-size:18px}
.calc-hours{text-align:right;font-size:12.5px;color:var(--chrome-dark-60);margin-top:5px}
.calc-note{font-size:12px;color:var(--chrome-dark-60);font-style:italic;margin-top:10px;padding-top:10px;border-top:1px dashed var(--chrome-dark-40)}
 
/* image upload */
.drop{border:1.5px dashed var(--chrome-dark-40);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;transition:.15s;background:var(--white)}
.drop:hover,.drop.over{border-color:var(--quantum-blue);background:var(--quantum-blue-20)}
.drop .dtext{font-size:14px;color:var(--chrome-dark-60);font-weight:var(--w-semi)}
.drop .dtext b{color:var(--quantum-blue)}
.thumbs{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.thumb{position:relative;width:96px}
.thumb img{width:96px;height:96px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--chrome-dark-20);display:block}
.thumb .name{font-size:11px;color:var(--chrome-dark-60);margin-top:5px;word-break:break-word;line-height:1.3}
.thumb .rm{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--qubit-rose);color:#fff;border:0;font-size:15px;font-weight:700;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
 
/* dynamic repeat fields */
.repeat-item{margin-top:16px}
.repeat-item:first-child{margin-top:0}
.repeat-item .rlabel{display:block;font-weight:var(--w-semi);font-size:13px;color:var(--chrome-dark);margin-bottom:8px}
.repeat-item .rlabel .num{color:var(--quantum-blue);font-weight:var(--w-bold)}
 
/* ---- Footer nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:16px 40px;background:var(--white);border:1px solid var(--chrome-dark-20);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(61,68,73,.10)}
.nav-msg{flex:1;text-align:center;color:var(--qubit-rose);font-weight:var(--w-semi);font-size:13px;line-height:1.35;padding:0 8px;min-height:1.2em}
.btn{font-family:var(--font-body);font-weight:var(--w-bold);font-size:15px;border-radius:var(--radius);padding:13px 26px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
.btn-primary{background:var(--quantum-blue);color:var(--white)}
.btn-primary:hover{background:#0072d9}
.btn-ghost{background:transparent;color:var(--chrome-dark);border-color:var(--chrome-dark-20)}
.btn-rose{background:var(--qubit-rose);color:var(--white)}
.btn-rose:hover{background:#d81f8f}
.btn-ghost:hover{border-color:var(--chrome-dark-40)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-lg{font-size:16px;padding:15px 36px}
.gen-cta{margin-top:30px;align-self:flex-start}
.nav .spacer{flex:1}
.btn-text{background:none;border:0;color:var(--chrome-dark-60);font-family:var(--font-body);font-weight:var(--w-semi);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-text:hover{color:var(--quantum-blue)}
 
/* ---- Review ---- */
.review h2{font-family:var(--font-display);font-weight:var(--w-bold);font-size:28px;letter-spacing:var(--ls-display);color:var(--chrome-dark)}
.review p.sub{color:var(--chrome-dark-60);margin-top:8px;font-size:15px}
.row{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid var(--chrome-dark-20)}
.row .k{flex:0 0 180px;font-weight:var(--w-semi);font-size:12px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--chrome-dark-60);padding-top:2px}
.row .v{flex:1;font-weight:var(--w-reg);font-size:17px;color:var(--chrome-dark)}
.row .edit{margin-left:auto;align-self:start}
.handoff{margin-top:28px;background:var(--chrome-light);border-radius:var(--radius);padding:20px}
.handoff h3{font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:var(--w-semi);color:var(--quantum-blue)}
.handoff p{font-size:14px;color:var(--chrome-dark);margin-top:8px}
.handoff pre{margin-top:14px;background:var(--white);border:1px solid var(--chrome-dark-20);border-radius:var(--radius);padding:14px;font-family:ui-monospace,monospace;font-size:12px;color:var(--chrome-dark);white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto}
.handoff .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;visibility:hidden;background:var(--chrome-dark);color:var(--white);padding:12px 22px;border-radius:var(--radius);font-weight:var(--w-semi);font-size:14px;transition:transform .25s,opacity .25s,visibility .25s;z-index:40}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
 
/* ===== Generated brief document + preview ===== */
#previewWrap{position:fixed;inset:0;background:var(--chrome-dark-20);z-index:20;overflow:auto;display:none}
#previewWrap.show{display:block}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:16px 40px;background:var(--white);border:1px solid var(--chrome-dark-20);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(61,68,73,.10)}
.pbar .spacer{flex:1}
.pbar .phint{font-size:12px;color:var(--chrome-dark-60);font-weight:var(--w-semi)}
.pd-scaler{display:flex;justify-content:center;padding:28px 16px 130px}
.pd{width:210mm;min-height:297mm;background:var(--white);box-shadow:0 4px 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
 
.pd-head{background:var(--quantum-blue);color:var(--white);padding:20mm 18mm 14mm}
.pd-logo{height:24px}
.pd-logo svg{height:100%;width:auto}
.pd-eyebrow{font-weight:var(--w-semi);letter-spacing:var(--ls-label);text-transform:uppercase;font-size:11px;color:var(--quantum-blue)}
.pd-eyebrow-light{color:rgba(255,255,255,.85);margin-top:22px}
.pd-title{font-family:var(--font-display);font-weight:var(--w-bold);font-size:40px;letter-spacing:var(--ls-display);line-height:1.05;margin-top:8px}
.pd-meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:22px}
.pd-meta-k{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);font-weight:var(--w-semi);color:rgba(255,255,255,.75)}
.pd-meta-v{font-size:15px;font-weight:var(--w-semi);margin-top:3px}
 
.pd-body-wrap{padding:12mm 18mm;flex:1}
.pd-sec{margin-top:9mm;break-inside:avoid;page-break-inside:avoid}
.pd-sec-flow{break-inside:auto;page-break-inside:auto}
.pd-var{break-inside:avoid;page-break-inside:avoid}
.pd-eyebrow{break-after:avoid;page-break-after:avoid}
.pd-body{break-inside:avoid;page-break-inside:avoid}
.pd-sec:first-child{margin-top:0}
.pd-body{font-size:11.5pt;line-height:1.55;color:var(--chrome-dark);font-weight:var(--w-light);margin-top:6px;overflow-wrap:break-word}
.pd-body a{color:var(--quantum-blue);word-break:break-all}
.pd-subh{font-size:14pt;font-weight:var(--w-bold);color:var(--chrome-dark);margin-top:6px;break-after:avoid;page-break-after:avoid}
.pd-url{font-size:10.5pt;color:var(--quantum-blue);font-weight:var(--w-semi);margin-top:8px;word-break:break-all}
 
.pd-tags,.pd-prod-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pd-tag{background:var(--quantum-blue-20);color:var(--quantum-blue);font-weight:var(--w-semi);font-size:11pt;padding:6px 14px;border-radius:var(--radius)}
.pd-chip{background:var(--chrome-light);color:var(--chrome-dark);font-size:10.5pt;font-weight:var(--w-semi);padding:6px 14px;border-radius:var(--radius)}
.pd-chip b{color:var(--quantum-blue);margin-left:4px;font-weight:var(--w-bold)}
 
.pd-prod{margin-top:8px}
.pd-total{margin-top:14px;display:flex;align-items:baseline;gap:10px}
.pd-total-num{font-family:var(--font-display);font-weight:var(--w-bold);font-size:46px;color:var(--qubit-rose);line-height:1}
.pd-total-lab{font-size:11pt;text-transform:uppercase;letter-spacing:var(--ls-label);font-weight:var(--w-semi);color:var(--chrome-dark-60)}
.pd-chs{margin-top:12px;border-top:1px solid var(--chrome-dark-20)}
.pd-ch{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--chrome-dark-20)}
.pd-ch span:first-child{flex:1;font-weight:var(--w-semi);font-size:11pt;color:var(--chrome-dark)}
.pd-ch-mul{font-family:ui-monospace,monospace;font-size:9.5pt;color:var(--chrome-dark-60)}
.pd-ch-num{font-weight:var(--w-bold);font-size:12pt;color:var(--quantum-blue);min-width:40px;text-align:right}
 
.pd-hooks{margin:8px 0 0;padding:0;list-style:none;counter-reset:h}
.pd-hooks li{counter-increment:h;position:relative;padding:8px 0 8px 34px;font-size:11.5pt;line-height:1.5;color:var(--chrome-dark);font-weight:var(--w-light);border-bottom:1px solid var(--chrome-dark-20)}
.pd-hooks li::before{content:counter(h);position:absolute;left:0;top:8px;color:var(--quantum-blue);font-weight:var(--w-bold);font-family:var(--font-display)}
 
.pd-imgs{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;margin-top:12px}
.pd-imgs figure{margin:0;break-inside:avoid;page-break-inside:avoid}
.pd-imgs img{display:block;max-width:500px;max-height:500px;width:auto;height:auto;object-fit:contain;border-radius:var(--radius);border:1px solid var(--chrome-dark-20)}
.pd-imgs figcaption{font-size:8.5pt;color:var(--chrome-dark-60);margin-top:4px;word-break:break-word}
 
.pd-foot{padding:8mm 18mm;border-top:1px solid var(--chrome-dark-20);display:flex;align-items:center;justify-content:space-between}
.weave-block{position:relative;margin:12px 0;break-inside:avoid;page-break-inside:avoid}
.weave-pre{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:8.7pt;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:#f6f8fa;border:1px solid var(--chrome-dark-20);border-radius:8px;padding:16px 16px 14px;color:var(--chrome-dark);margin:0}
.weave-copy{position:absolute;top:8px;right:8px;font-family:var(--font-body);font-size:12px;font-weight:var(--w-semi);color:var(--quantum-blue);background:var(--white);border:1px solid var(--quantum-blue);border-radius:6px;padding:5px 10px;cursor:pointer}
.weave-copy:hover{background:var(--quantum-blue);color:var(--white)}
.pd-foot-logo{height:14px}
.pd-foot-logo svg{height:100%;width:auto}
.pd-foot-date{font-size:8.5pt;color:var(--chrome-dark-60);font-weight:var(--w-semi)}
 
@media print{

const state = {};            // { sectionId: value }
let step = 0;                // 0..SECTIONS.length-1, then review
const REVIEW = SECTIONS.length;
 
const $=s=>document.querySelector(s);
const stage=$('#stage'), nav=$('#nav'), prog=$('#progress'), toast=$('#toast');
 
// --- required-field highlighting ---
let showErrors=false;      // set true when Next is pressed on an incomplete section
let firstInvalid=null;     // first flagged element this render (for scroll-to)
let sceneViewIdx={};       // per-persona index of the variation currently shown in step 8
function isEmptyText(v){ return !v || !String(v).trim(); }
function flag(el, empty){ if(showErrors && empty && el){ el.classList.add('invalid'); if(!firstInvalid) firstInvalid=el; } return el; }
// clear a field's highlight as soon as the user interacts with it
stage.addEventListener('input', e=>{ const t=e.target.closest('.invalid'); if(t) t.classList.remove('invalid'); }, true);

function brandCode(){ return state.brand ? state.brand : ''; }
 
function canGoTo(target){
  for(let j=0;j<target;j++){ if(SECTIONS[j].required && !isFilled(SECTIONS[j])) return false; }
  return true;
}
function gotoStep(i){
  if(i===step) return;
  if(canGoTo(i)){ showErrors=false; step=i; rerender(); window.scrollTo(0,0); }
  else { const e=$('#err'); if(e) e.textContent='Finish the earlier required steps first.'; }
}
function renderProgress(){
  prog.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    const p=document.createElement('span');
    p.className='pip'+(i<step?' done':'')+(i===step?' active':'')+(canGoTo(i)?' go':'');
    p.title=s.eyebrow+(canGoTo(i)?'':' — finish earlier steps first');
    p.onclick=()=>gotoStep(i);
    prog.appendChild(p);
  });
  const c=document.createElement('span'); c.className='count';
  c.textContent = step<REVIEW ? `Step ${step+1} of ${SECTIONS.length}` : 'Review';
  prog.appendChild(c);
}
 
function selectedCreatives(){
  const sel=Array.isArray(state.creative)?state.creative:[];
  return CREATIVE.filter(c=>sel.includes(c.value));
}
function aiUgcSelected(){ return Array.isArray(state.creative) && state.creative.includes('Motion - AI UGC'); }
function personaCount(){
  if(state['persona__tab']==='channel') return 1;
  const n = state.persona && Array.isArray(state.persona.personas) ? state.persona.personas.length : 0;
  return n || 1;
}
function fmtVersions(v){ return +((state.volume&&state.volume[v]&&state.volume[v].versions))||0; }
function fmtVariations(v){ return +((state.volume&&state.volume[v]&&state.volume[v].variations))||0; }
function aiUgcPerPersona(v){ const s=state.volume&&state.volume[v]; return (s&&Array.isArray(s.perPersona))?s.perPersona:[]; }
function aiUgcVariations(v){ return aiUgcPerPersona(v).reduce((a,x)=>a+(+x||0),0); }
 
function fmtHrs(h){
  const m=Math.round(h*60), hh=Math.floor(m/60), mm=m%60;
  if(hh&&mm) return `${hh}h ${mm}m`;
  if(hh) return `${hh}h`;
  return `${mm}m`;
}
 
function timeBreakdown(){
  const formats=selectedCreatives().map(cr=>{
    if(cr.variationsOnly){
      const counts=aiUgcPerPersona(cr.value).map(x=>+x||0), va=counts.reduce((a,x)=>a+x,0);
      const nP=counts.length;
      const hours = nP*(cr.versionHours||0) + va*(cr.variationHours||0);
      return {label:cr.label, value:cr.value, versions:0, variations:va, perPersonaCounts:counts, personas:nP, hours, variationsOnly:true};
    }
    const v=fmtVersions(cr.value), va=fmtVariations(cr.value);
    const hours = v*(cr.versionHours||0) + va*(cr.variationHours||0);
    return {label:cr.label, value:cr.value, versions:v, variations:va, hours, variationsOnly:false};
  });
  const baseHours=formats.reduce((s,f)=>s+f.hours,0);
  let extraHours=0; const extras=[];
  if(supportingStaticsOn()){
    const nVar = aiUgcVariations(aiUgcValue()) || 0;
    const mins = SUPPORTING_STATICS.extraMinutes * nVar;
    extraHours += mins/60;
    extras.push({label:SUPPORTING_STATICS.label, minutes:mins, perVariation:SUPPORTING_STATICS.extraMinutes, count:nVar});
  }
  const totalHours=baseHours+extraHours;
  return {formats, extras, extraHours, totalHours, totalDays: totalHours/WORK.hoursPerDay};
}
 
function assetBreakdown(){
  const formats=selectedCreatives().map(c=>{
    if(c.variationsOnly){
      const counts=aiUgcPerPersona(c.value).map(x=>+x||0), variations=counts.reduce((a,x)=>a+x,0);
      return {label:c.label, value:c.value, versions:0, variations, perPersonaCounts:counts, personas:counts.length, units:variations, variationsOnly:true};
    }
    const versions=fmtVersions(c.value), variations=fmtVariations(c.value);
    return {label:c.label, value:c.value, versions, variations, units:versions*variations, variationsOnly:false};
  });
  const baseUnits=formats.reduce((s,f)=>s+f.units,0);
  const sel=Array.isArray(state.channels)?state.channels:[];
  const rows=sel.map(v=>{const ch=findChannel(v);const a=channelAssets(ch);return {channel:v, perAsset:a, assets:baseUnits*a};});
  const total=rows.reduce((s,r)=>s+r.assets,0);
  return {formats, baseUnits, rows, total};
}
 
function renderAssetCalc(container){
  const b=assetBreakdown();
  const div=document.createElement('div'); div.className='calc';
  const empty=m=>{div.innerHTML=`<h3>Asset output</h3><p class="calc-empty">${m}</p>`;container.appendChild(div);};
  if(!b.formats.length) return empty('Select creative formats first to calculate output.');
  if(!b.baseUnits) return empty('Set versions and variations first to calculate output.');
  if(!b.rows.length) return empty('Select one or more channels to calculate output.');
  const plural=(n,w)=>`${n} ${w}${n==1?'':'s'}`;
  const d1=x=>(Math.round(x*10)/10).toFixed(1);
  const rng1=(lo,hi)=> d1(lo)===d1(hi)?d1(lo):`${d1(lo)}–${d1(hi)}`;
  const fmtRows=b.formats.map(f=>`<div class="calc-row"><div class="calc-main"><span class="calc-label">${escapeHtml(f.label)}</span><span class="calc-detail">${f.variationsOnly?(f.personas>1?f.perPersonaCounts.join(' + ')+' = '+plural(f.variations,'variation'):plural(f.variations,'variation')):plural(f.versions,'version')+' × '+plural(f.variations,'variation')}</span></div><span class="calc-num">${f.units}</span></div>`).join('');
  const chRows=b.rows.map(r=>`<div class="calc-row"><div class="calc-main"><span class="calc-label">${escapeHtml(r.channel)}</span><span class="calc-detail">${plural(b.baseUnits,'creative unit')} × ${plural(r.perAsset,'format')}</span></div><span class="calc-num">${r.assets}</span></div>`).join('');
  const tb=timeBreakdown();
  const timeRows=tb.formats.map(f=>`<div class="calc-row"><div class="calc-main"><span class="calc-label">${escapeHtml(f.label)}</span><span class="calc-detail">${f.variationsOnly?(plural(f.personas,'persona')+' + '+plural(f.variations,'variation')):(plural(f.versions,'version')+' + '+plural(f.variations,'variation'))}</span></div><span class="calc-num">${fmtHrs(f.hours)}</span></div>`).join('')
    + (tb.extras||[]).map(e=>`<div class="calc-row"><div class="calc-main"><span class="calc-label">${escapeHtml(e.label)}</span><span class="calc-detail">${e.perVariation?`${e.perVariation}m × ${e.count} variation${e.count===1?'':'s'}`:'supporting add-on'}</span></div><span class="calc-num">+${fmtHrs(e.minutes/60)}</span></div>`).join('');
  const approach=state['persona__tab']||'persona';
  const personaCount = approach==='persona' && state.persona && Array.isArray(state.persona.personas) ? state.persona.personas.length : 0;
  div.innerHTML=`<h3>Asset output</h3>
    ${personaCount?`<div class="calc-group">Audience</div><div class="calc-row"><div class="calc-main"><span class="calc-label">Personas</span></div><span class="calc-num">${personaCount}</span></div>`:''}
    <div class="calc-group">Creative units — versions × variations</div>
    ${fmtRows}
    <div class="calc-row calc-subtotal"><span>Total creative units</span><span class="calc-num">${b.baseUnits}</span></div>
    <div class="calc-group">Assets per channel — units × formats</div>
    ${chRows}
    <div class="calc-row calc-total"><span>Total assets</span><span class="calc-num">${b.total}</span></div>
    <div class="calc-group">Estimated production time</div>
    ${timeRows}
    <div class="calc-row calc-timetotal"><span>Estimated time</span><span class="calc-num">${fmtHrs(tb.totalHours)}</span></div>
    <div class="calc-hours">≈ ${(Math.round(tb.totalDays*10)/10).toFixed(1)} working days · 7.5h/day</div>
    <div class="calc-note">Rough estimate only — actual production time will vary.</div>`;
  container.appendChild(div);
}
 
function renderPerCreativeRepeat(container, store, countFn, itemLabel, itemType, placeholder){
  const formats=selectedCreatives();
  if(!formats.length){
    const w=document.createElement('div'); w.className='helper'; w.style.color='var(--qubit-rose)'; w.style.fontWeight='600';
    w.textContent='Select creative formats first in step 5.'; container.appendChild(w); return;
  }
  formats.forEach(c=>{
    const head=document.createElement('div'); head.className='subhead'; head.textContent=c.label; container.appendChild(head);
    const n=countFn(c.value);
    if(!n){
      const w=document.createElement('div'); w.className='subhelp'; w.style.color='var(--qubit-rose)';
      w.textContent='Set this format’s count in step 6 first.'; container.appendChild(w); return;
    }
    if(!Array.isArray(store[c.value])) store[c.value]=[];
    renderRepeat(container, store[c.value], n, itemLabel, placeholder, itemType);
  });
}
 
function perCreativeFilled(store, countFn){
  const formats=selectedCreatives(); if(!formats.length) return false;
  for(const c of formats){
    const n=countFn(c.value); if(!n) return false;
    const a=(store&&store[c.value])||[];
    for(let i=0;i<n;i++){ if(!a[i]||!String(a[i]).trim()) return false; }
  }
  return true;
}
 
function displayPerCreative(store, countFn){
  const formats=selectedCreatives(); if(!formats.length) return '—';
  return formats.map(c=>{
    const n=countFn(c.value); const a=(store&&store[c.value])||[];
    const items=n?Array.from({length:n},(_,i)=>`  ${i+1}: ${a[i]&&a[i].trim()?a[i]:'—'}`).join('\n'):'  —';
    return `${c.label}:\n${items}`;
  }).join('\n');
}
 
function renderRepeat(container, arr, count, itemLabel, placeholder, itemType){
  for(let i=0;i<count;i++){
    const item=document.createElement('div'); item.className='repeat-item';
    const lab=document.createElement('label'); lab.className='rlabel';
    lab.innerHTML=`${itemLabel} <span class="num">${i+1}</span>`;

    const el = itemType==='textarea' ? document.createElement('textarea') : document.createElement('input');

    flag(el, isEmptyText(arr[i]));
    item.appendChild(el); container.appendChild(item);
    if(i===0) setTimeout(()=>el.focus({preventScroll:true}),0);
  }
  arr.length=count;   // trim if the source count was reduced

function renderImageField(container, secId, key){
  if(!Array.isArray(state[secId][key])) state[secId][key]=[];
  const list=state[secId][key];
  const drop=document.createElement('div'); drop.className='drop';
  drop.innerHTML=`<div class="dtext"><b>Click to upload</b> or drag images here</div>`;
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true; inp.style.display='none';
  const addFiles=files=>{
    [...files].forEach(f=>{
      if(!f.type.startsWith('image/')) return;
      const r=new FileReader();
      r.onload=e=>{ list.push({name:f.name,type:f.type,size:f.size,dataUrl:e.target.result}); renderSection(); renderNav(); };
      r.readAsDataURL(f);
    });
  };
  inp.onchange=e=>addFiles(e.target.files);
  drop.onclick=()=>inp.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files);};
  container.appendChild(drop); container.appendChild(inp);
  if(list.length){
    const t=document.createElement('div'); t.className='thumbs';
    list.forEach((im,idx)=>{
      const th=document.createElement('div'); th.className='thumb';
      th.innerHTML=`<img src="${im.dataUrl}" alt=""><div class="name">${escapeHtml(im.name)}</div>`;
      const rm=document.createElement('button'); rm.className='rm'; rm.textContent='×'; rm.title='Remove';
      rm.onclick=ev=>{ ev.stopPropagation(); list.splice(idx,1); renderSection(); renderNav(); };
      th.appendChild(rm); t.appendChild(th);
    });
    container.appendChild(t);
  }
}
 
function singleGroup(options, current, onPick, compact){

    c.innerHTML=`<span class="dot"></span><span class="lab">${codeHtml}${o.label}</span>`;
    if(!o.disabled) c.onclick=()=>onPick(o.value);
    wrap.appendChild(c);
  });
  return wrap;

function renderGroupRepeat(container, items, f){
  if(!items.length) items.push({});
  const minItems=f.minItems||1;
  items.forEach((item, idx)=>{
    const card=document.createElement('div'); card.className='group-card';
    const head=document.createElement('div'); head.className='group-head';
    const ttl=document.createElement('span'); ttl.className='group-title'; ttl.textContent=(f.itemLabel||'Item')+' '+(idx+1);
    head.appendChild(ttl);
    if(items.length>minItems){
      const rm=document.createElement('button'); rm.type='button'; rm.className='group-remove'; rm.textContent='Remove';
      rm.onclick=()=>{ items.splice(idx,1); $('#err').textContent=''; renderSection(); renderNav(); };
      head.appendChild(rm);
    }
    card.appendChild(head);
    f.fields.forEach(sub=>{
      if(sub.type==='heading'){
        const h=document.createElement('div'); h.className='subhead'; h.textContent=sub.label; card.appendChild(h);
        if(sub.helper){ const hp=document.createElement('div'); hp.className='subhelp'; hp.textContent=sub.helper; card.appendChild(hp); }
        return;
      }
      const wrap=document.createElement('div'); wrap.className='subfield';
      if(sub.label){
        const lab=document.createElement('label'); lab.className='slabel';
        lab.innerHTML=escapeHtml(sub.label)+(sub.required?' <span class="req">*</span>':'');
        wrap.appendChild(lab);
      }
      const el = sub.type==='textarea' ? document.createElement('textarea') : document.createElement('input');
      el.className='plain'; if(sub.type!=='textarea') el.type='text';
      el.placeholder=sub.placeholder||''; el.value=item[sub.key]||'';
      el.oninput=e=>{ item[sub.key]=e.target.value; $('#err').textContent=''; renderNav(); };
      flag(el, sub.required && isEmptyText(item[sub.key]));
      wrap.appendChild(el);
      card.appendChild(wrap);
    });
    container.appendChild(card);

// ---- Weave Brief (SeeDance Planner) plain-text output — AI UGC only ----
const WEAVE_INGREDIENT = {'B-Roll Montage':'B-Roll Montage','Direct to Camera':'Direct To Camera','In-Situ Demo':'In-Situ Demo','Split-screen Demo':'Splitscreen'};
function weaveFlow(){
  const b=(BRANDS.find(x=>x.code===state.brand)||{}).name||'';
  const m=state.market||'';
  if(b==='SlotsWise' && m==='UK') return 'SlotsWise UK iGaming';
  if(b==='SlotsWise' && m==='US') return 'SlotsWise US Sweeps';
  if((b==='Custard'||b==='Cashback') && m==='UK') return 'Custard/Cashback UK';
  return '';
}
function weaveIngredients(sc){
  const arr=Array.isArray(sc.ugcStructures)?sc.ugcStructures:[];
  const mapped=arr.map(v=>WEAVE_INGREDIENT[v]||v);
  return mapped.length?mapped.join(', '):'B-Roll Montage';
}
function weaveCharacters(sc){
  const lines=String(sc.character||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return '1 (\u2014)';
  return lines.length+' ('+lines.join(', ')+')';
}
function weaveSettings(sc){
  const s=(sc.settings||[]).map(x=>String(x||'').trim()).filter(Boolean);
  return (s.length||0)+' ('+(s.join(', ')||'\u2014')+')';
}
function weaveScriptLines(sc){
  const lines=String(sc.script||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return '  - \u2014';
  return lines.map(l=> /^[-\u2022]/.test(l) ? ('  '+l) : ('  - '+l)).join('\n');
}
function weaveBlockText(pp, i, sc, v){
  const DIV='\u2500'.repeat(56);
  const brand=(BRANDS.find(x=>x.code===state.brand)||{}).name||state.brand||'\u2014';
  const flow=weaveFlow();
  const title=(pp&&pp.title&&pp.title.trim())?pp.title.trim():'';
  const hook=String(sc.hook||'').trim();
  const structs=Array.isArray(sc.ugcStructures)?sc.ugcStructures:[];
  const L=[];
  L.push(DIV);
  L.push('PERSONA '+(i+1)+(title?(' \u2014 '+title):'')+'  (Variation '+(v+1)+': "'+hook+'")');
  L.push(DIV);
  L.push('BRAND: '+brand+(flow?('  |  FLOW: '+flow):''));
  L.push('UGC INGREDIENTS: '+weaveIngredients(sc)+'  |  DURATION: '+(sc.duration||'\u2014')+'  |  FORMAT: Vertical 9:16');
  L.push('HOOK: '+(hook||'\u2014'));
  L.push('CHARACTERS: '+weaveCharacters(sc));
  L.push('SETTINGS: '+weaveSettings(sc));
  if(structs.includes('In-Situ Demo')) L.push('IN-SITU DEMO: '+String(sc.productDemoDetail||'').trim());
  if(structs.includes('Split-screen Demo')) L.push('SPLITSCREEN DEMO: '+String(sc.splitScreenDetail||'').trim());
  L.push('SCRIPT / TALKING POINTS:');
  L.push(weaveScriptLines(sc));
  if(pp && ((pp.description&&pp.description.trim())||(pp.motivatorPain&&pp.motivatorPain.trim()))){
    L.push('');
    if(pp.description&&pp.description.trim()) L.push('PERSONA DETAILS \u2014 "'+(title||'\u2014')+'": '+pp.description.trim());
    if(pp.motivatorPain&&pp.motivatorPain.trim()) L.push('PAIN POINTS / MOTIVATORS: '+pp.motivatorPain.trim());
  }
  return L.join('\n');
}
function buildWeaveBrief(){
  if(!aiUgcSelected()) return [];
  const out=[];
  scenePersonas().forEach((pp,i)=>{
    const arr=((state.creativeBreakdown&&state.creativeBreakdown.scenes)||[])[i]||[];
    const vc=variationCountForPersona(i);
    for(let v=0; v<vc; v++) out.push(weaveBlockText(pp,i,arr[v]||{},v));
  });
  return out;
}
function copyWeaveBlock(btn){
  const pre=btn.parentElement.querySelector('.weave-pre'); if(!pre) return;
  const txt=pre.textContent;
  const done=()=>{ btn.textContent='Copied \u2713'; setTimeout(()=>{btn.textContent='Copy block';},1400); };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>{legacyCopy(txt);done();}); return; } }catch(e){}
  legacyCopy(txt); done();
}
function legacyCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

function scenePersonas(){
  const usingP = state['persona__tab']!=='channel' && state.persona && Array.isArray(state.persona.personas) && state.persona.personas.length;
  return usingP ? state.persona.personas : [null];

function variationCountForPersona(i){ return +((aiUgcPerPersona(aiUgcValue())[i])||0)||0; }
function structureText(sc){
  const structs=Array.isArray(sc.ugcStructures)?sc.ugcStructures:[];
  if(!structs.length) return '';
  return structs.map(v=>{ const o=UGC_STRUCTURES.find(x=>x.value===v); const d=o&&o.detailKey?sc[o.detailKey]:''; return d&&String(d).trim()? (v+' — '+String(d).trim()) : v; }).join(', ');
}
function sceneComplete(sc){
  if(!sc) return false;
  if(isEmptyText(sc.character)) return false;
  if(!(Array.isArray(sc.settings)&&sc.settings.some(x=>x&&String(x).trim()))) return false;
  if(isEmptyText(sc.script)) return false;
  if(isEmptyText(sc.hook)) return false;
  const structs = Array.isArray(sc.ugcStructures)?sc.ugcStructures:[];
  if(!structs.length) return false;
  for(const o of UGC_STRUCTURES){ if(o.detailKey && structs.includes(o.value) && isEmptyText(sc[o.detailKey])) return false; }
  if(!sc.duration) return false;
  return true;
}

  if(s.type==='perCreativeVolume'){
    if(typeof state[s.id]!=='object'||!state[s.id]) state[s.id]={};
    const formats=selectedCreatives();

        if(typeof state[s.id][c.value]!=='object'||!state[s.id][c.value]) state[s.id][c.value]={};

function fieldFilled(o, f){
  if(f.type==='heading') return true;
  if(f.type==='groupRepeat'){
    const items=o[f.key]||[];
    if(!items.length) return false;
    return items.every(it=>f.fields.every(sub=> sub.type==='heading'||!sub.required || (it[sub.key]&&String(it[sub.key]).trim()!=='') ));
  }
  if(!f.required) return true;
  if(f.type==='perCreativeRepeat') return perCreativeFilled(o[f.key], f.countFn);
  if(f.type==='repeat'){ const n=f.countFrom(); if(!n) return false; const a=o[f.key]||[]; for(let i=0;i<n;i++){ if(!a[i]||!String(a[i]).trim()) return false; } return true; }
  if(f.type==='images') return (o[f.key]||[]).length>0;
  return o[f.key]&&String(o[f.key]).trim()!=='';
}
function niceLabel(f){ return f.label || f.key.replace(/([A-Z])/g,' $1').replace(/^./,function(c){return c.toUpperCase();}); }
 
function isFilled(s){
  if(s.id==='creativeBreakdown' && aiUgcSelected()){
    const scenes=(state.creativeBreakdown&&state.creativeBreakdown.scenes)||[];
    const personas=scenePersonas();
    for(let i=0;i<personas.length;i++){
      const vc=variationCountForPersona(i);
      if(!vc) return false;
      const arr=scenes[i]||[];
      if(arr.length<vc) return false;
      for(let v=0;v<vc;v++){ if(!sceneComplete(arr[v])) return false; }
    }
    return true;
  }
  if(s.type==='multi'){
    if(s.id==='channels' && aiUgcSelected() && !state.supportingStatics) return false;
    return Array.isArray(state[s.id]) && state[s.id].length>0;
  }
  if(s.type==='perCreativeVolume'){
    const formats=selectedCreatives(); if(!formats.length) return false;
    return formats.every(c=>{const o=(state[s.id]&&state[s.id][c.value])||{};
      if(c.variationsOnly){ const pp=o.perPersona||[]; const n=scenePersonas().length; if(pp.length<n) return false; for(let i=0;i<n;i++){ if(!pp[i]) return false; } return true; }
      return o.versions&&o.variations;
    });
  }
  if(s.id==='hooks' && aiUgcSelected()){
    const h=state.hooks||{};
    if(!h.additional) return false;
    if(h.additional==='Yes' && (!h.additionalText||!String(h.additionalText).trim())) return false;
    return true;
  }
  if(s.type==='perCreativeRepeat') return perCreativeFilled(state[s.id], s.countFn);
  if(s.type==='repeat'){
    const n=s.countFrom(); if(!n) return false;
    const a=state[s.id]||[];
    for(let i=0;i<n;i++){ if(!a[i]||!String(a[i]).trim()) return false; }
    return true;
  }
  if(s.type==='compound'){
    const o=state[s.id]||{};
    return s.fields.every(f=>fieldFilled(o,f));
  }
  if(s.type==='tabbed'){
    const o=state[s.id]||{};
    return s.tabs.some(t=>t.fields.every(f=>fieldFilled(o,f)));
  }
  const v=state[s.id];
  if(s.type==='text' && s.prefixFrom && !state[s.prefixFrom]) return false;
  return v!==undefined && String(v).trim()!=='';
}
function tabFilled(s, t){ const o=state[s.id]||{}; return t.fields.every(f=>fieldFilled(o,f)); }
 
// human-readable value for review + copy
function displayValue(s){
  if(s.id==='creativeBreakdown' && aiUgcSelected()){
    const scenes=(state.creativeBreakdown&&state.creativeBreakdown.scenes)||[];
    const personas=scenePersonas();
    return personas.map((p,i)=>{
      const vc=variationCountForPersona(i); const arr=scenes[i]||[];
      const lines=[p!==null?personaLabel(p,i):'Scene'];
      for(let v=0;v<vc;v++){ const sc=arr[v]||{};
        const setts=(sc.settings||[]).filter(x=>x&&String(x).trim());
        const extra=[];
        const st=structureText(sc); if(st) extra.push(st);
        if(sc.duration) extra.push(sc.duration);
        if(sc.script&&sc.script.trim()) extra.push('script ✓');
        const hook = sc.hook&&sc.hook.trim() ? sc.hook.trim() : '—';
        const rest = `${sc.character&&sc.character.trim()?sc.character:'—'}${setts.length?' — '+setts.join(', '):''}${extra.length?' · '+extra.join(' · '):''}`;
        lines.push(`  Variation ${v+1}: “${hook}” · ${rest}`);
      }
      return lines.join('\n');
    }).join('\n\n');
  }
  if(s.id==='brand'){const b=BRANDS.find(b=>b.code===state.brand);return b?`${b.code} — ${b.name}`:'—';}
  if(s.id==='channels'){const a=state.channels||[];if(!a.length)return '—';const ab=assetBreakdown();const ss=aiUgcSelected()&&state.supportingStatics?`  ·  Supporting statics: ${state.supportingStatics}`:'';return a.join(', ')+(ab.total?`  ·  ${ab.total} assets`:'')+ss;}
  if(s.type==='perCreativeVolume'){
    const formats=selectedCreatives(); if(!formats.length) return '—';
    return formats.map(c=>{const o=(state[s.id]&&state[s.id][c.value])||{};
      if(c.variationsOnly){
        const personas=scenePersonas(); const pp=o.perPersona||[];
        if(personas.length>1){
          const parts=personas.map((pers,i)=>`${personaLabel(pers,i)}: ${pp[i]||'—'}`);
          const sum=pp.reduce((a,x)=>a+(+x||0),0);
          return `${c.label}: ${parts.join(', ')} (${sum} total)`;
        }
        return `${c.label}: ${pp[0]||'—'} variations`;
      }
      return `${c.label}: ${o.versions||'—'} versions, ${o.variations||'—'} variations`;
    }).join('\n');
  }
  if(s.id==='hooks' && aiUgcSelected()){
    const h=state.hooks||{};
    if(!h.additional) return '—';
    return h.additional==='Yes' ? ('Yes — '+String(h.additionalText||'').trim()) : 'No';
  }
  if(s.type==='perCreativeRepeat') return displayPerCreative(state[s.id], s.countFn);
  if(s.type==='multi'){const a=state[s.id]||[];const opts=s.optionsFrom?s.optionsFrom():s.options;return a.length?a.map(v=>{const o=opts.find(o=>o.value===v);return o?o.label:v;}).join(', '):'—';}
  if(s.type==='repeat'){
    const n=s.countFrom(); const a=state[s.id]||[];
    if(!n) return '—';
    return Array.from({length:n},(_,i)=>`${i+1}: ${a[i]&&a[i].trim()?a[i]:'—'}`).join('\n');
  }
  if(s.type==='tabbed'){
    const o=state[s.id]||{};
    const at=s.tabs.find(t=>t.id===(state[s.id+'__tab']||s.tabs[0].id))||s.tabs[0];
    return at.fields.filter(f=>f.key).map(f=>{
      if(f.type==='groupRepeat'){
        const items=o[f.key]||[];
        if(!items.length) return '—';
        return items.map((it,idx)=>{
          const lines=f.fields.filter(sub=>sub.key).map(sub=>`${niceLabel(sub)}: ${(it[sub.key]&&String(it[sub.key]).trim())?it[sub.key]:'—'}`);
          return `${f.itemLabel||'Item'} ${idx+1}\n${lines.join('\n')}`;
        }).join('\n\n');
      }
      let v;
      if(f.type==='images'){const arr=o[f.key]||[];v=arr.length?`${arr.length} image${arr.length>1?'s':''} (${arr.map(im=>im.name).join(', ')})`:'—';}
      else if(f.type==='perCreativeRepeat'){v=displayPerCreative(o[f.key], f.countFn);}
      else v=(o[f.key]&&String(o[f.key]).trim())?o[f.key]:'—';
      return `${niceLabel(f)}: ${v}`;
    }).join('\n');
  }
  if(s.type==='compound'){
    const o=state[s.id]||{};
    return s.fields.filter(f=>f.key).map(f=>{
      let v;
      if(f.type==='images'){const arr=o[f.key]||[];v=arr.length?`${arr.length} image${arr.length>1?'s':''} (${arr.map(im=>im.name).join(', ')})`:'—';}
      else if(f.type==='perCreativeRepeat'){v=displayPerCreative(o[f.key], f.countFn);}
      else if(f.type==='repeat'){const n=f.countFrom?f.countFrom():0;const a=o[f.key]||[];v=n?Array.from({length:n},(_,i)=>`${i+1}: ${a[i]&&a[i].trim()?a[i]:'—'}`).join('\n'):'—';}
      else v=(o[f.key]&&String(o[f.key]).trim())?o[f.key]:'—';
      return `${f.label||(f.key.charAt(0).toUpperCase()+f.key.slice(1))}: ${v}`;
    }).join('\n');
  }
  const v=state[s.id];
  return (v!==undefined&&String(v).trim()!=='')?String(v):'—';
}
 
function fillNav(container, mode){
  container.innerHTML='';
  if(mode==='review'){
    const back=mkBtn('Back','btn-ghost',()=>{showErrors=false;step=SECTIONS.length-1;rerender();window.scrollTo(0,0);});
    const spacer=document.createElement('div'); spacer.className='nav-msg';
    const gen=mkBtn('Generate brief','btn-rose',openPreview);
    container.append(back); container.append(spacer); container.append(gen);
    return;
  }
  const back=mkBtn('Back','btn-ghost',()=>{ if(step>0){showErrors=false;step--;rerender();window.scrollTo(0,0);} });
  back.disabled=step===0;
  const next=mkBtn(step===SECTIONS.length-1?'Review brief':'Next','btn-primary',()=>{
    const s=SECTIONS[step];
    if(s.required && !isFilled(s)){
      // on the AI UGC scene step, surface the first incomplete variation per persona
      if(s.id==='creativeBreakdown' && aiUgcSelected()){
        const scenes=(state.creativeBreakdown&&state.creativeBreakdown.scenes)||[];
        scenePersonas().forEach((p,i)=>{
          const vc=variationCountForPersona(i); const arr=scenes[i]||[];
          for(let v=0; v<vc; v++){ if(!sceneComplete(arr[v])){ sceneViewIdx[i]=v; break; } }
        });
      }
      showErrors=true;
      renderSection(); renderNav();
      if(firstInvalid){
        firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
        const inp=firstInvalid.matches('input,textarea')?firstInvalid:firstInvalid.querySelector('input,textarea');
        if(inp) setTimeout(()=>inp.focus({preventScroll:true}),300);
      }
      const e=$('#err'); if(e) e.textContent='Please complete the highlighted field'+(document.querySelectorAll('.invalid').length>1?'s':'')+' to continue.';
      return;
    }
    showErrors=false;
    step++; rerender(); window.scrollTo(0,0);
  });
  const msg=document.createElement('div'); msg.className='nav-msg'; msg.id='err';
  container.append(back); container.append(msg); container.append(next);
}

      scenes: aiUgcSelected() ? scenePersonas().map((p,i)=>({persona:(p!==null)?personaLabel(p,i):'Scene', variations: Array.from({length:variationCountForPersona(i)}, (_,v)=>{ const sc=((cb.scenes&&cb.scenes[i])||[])[v]||{}; return {variation:v+1, character:sc.character||'', settings:(sc.settings||[]).filter(x=>x&&String(x).trim()), script:sc.script||'', ugc_structures:(Array.isArray(sc.ugcStructures)?sc.ugcStructures:[]), product_demo_detail:sc.productDemoDetail||'', split_screen_detail:sc.splitScreenDetail||'', hook:sc.hook||'', video_reference:sc.videoRef||'', duration:sc.duration||'', images:(sc.characterImages||[]).map(im=> full?{name:im.name,type:im.type,data:im.dataUrl}:{name:im.name}), setting_images:(sc.settingImages||[]).map(im=> full?{name:im.name,type:im.type,data:im.dataUrl}:{name:im.name})}; })})) : [],
      reference_url: cb.url||'',
      images: (cb.images||[]).map(im=> full ? {name:im.name, type:im.type, data:im.dataUrl} : {name:im.name}),
    },
    messaging_hooks: selectedCreatives().map(c=>({format:c.value, items:Array.from({length:fmtVariations(c.value)},(_,i)=>(hk[c.value]||[])[i]||'')})),
    additional_information: aiUgcSelected() ? {provided: (state.hooks&&state.hooks.additional)||'', detail: (state.hooks&&state.hooks.additionalText)||''} : null,
    production_time: (()=>{ const t=timeBreakdown(); const r1=x=>Math.round(x*10)/10; return {
      per_format: t.formats.map(f=>({format:f.value, hours:f.hours})),
      total_hours:r1(t.totalHours), total_days:r1(t.totalDays),
      estimate:true, basis:'fixed hours per version & variation · 7.5h day'
    }; })(),
    timing: { deadline: (state.timing&&state.timing.deadline)||'', go_live: (state.timing&&state.timing.golive)||'' },
    builder_version: APP_VERSION,
  };
}
 
/* helpers */
function rerender(){ renderProgress(); if(step<REVIEW){renderSection();renderNav();} else renderReview(); }
function mkBtn(t,c,fn){const b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.onclick=fn;return b;}
function mkTextBtn(t,fn){const b=document.createElement('button');b.className='btn-text';b.textContent=t;b.onclick=fn;return b;}
function spacer(){const d=document.createElement('span');d.className='spacer';return d;}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function nl2br(s){ const t=String(s==null?'':s).trim(); return t? escapeHtml(t).replace(/\r\n|\r|\n/g,'<br>') : ''; }
function showToast(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);}
function download(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();}
 
function formatDate(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
 
function buildBriefDoc(){
  const p=buildPayload(true);
  const ab=assetBreakdown();
  const brandLabel = p.brand ? `${p.brand.code} — ${p.brand.name}` : '—';
  const meta=[
    {k:'Brand', v:brandLabel},
    {k:'Market', v:p.market||'—'},
    {k:'Deadline', v:formatDate(p.timing.deadline)},
    {k:'Go-live', v:formatDate(p.timing.go_live)},
  ].map(m=>`<div class="pd-meta-item"><div class="pd-meta-k">${m.k}</div><div class="pd-meta-v">${escapeHtml(m.v)}</div></div>`).join('');
 
  const sec=(label,inner,cls)=>`<section class="pd-sec${cls?' '+cls:''}"><div class="pd-eyebrow">${label}</div>${inner}</section>`;
  const para=t=>`<p class="pd-body">${escapeHtml(t||'—').replace(/\n/g,'<br>')}</p>`;
 
  const fmtRows = ab.formats.length
    ? ab.formats.map(f=>`<div class="pd-ch"><span>${escapeHtml(f.label)}</span><span class="pd-ch-mul">${f.variationsOnly?(f.personas>1?f.perPersonaCounts.join('+'):f.variations+' var'):f.versions+'×'+f.variations}</span><span class="pd-ch-num">${f.units}</span></div>`).join('')
    : '';
  const perCh = ab.rows.length
    ? ab.rows.map(r=>`<div class="pd-ch"><span>${escapeHtml(r.channel)}</span><span class="pd-ch-mul">${ab.baseUnits}×${r.perAsset}</span><span class="pd-ch-num">${r.assets}</span></div>`).join('')
    : '';
  const production = `
    <div class="pd-prod">
      <div class="pd-prod-chips">
        ${p.persona.approach==='persona'?`<span class="pd-chip">Personas <b>${(p.persona.personas||[]).length||'—'}</b></span>`:''}
        <span class="pd-chip">Formats <b>${(p.creative_required||[]).length||'—'}</b></span>
        <span class="pd-chip">Creative units <b>${ab.baseUnits||'—'}</b></span>
        <span class="pd-chip">Channels <b>${(p.channels||[]).length||'—'}</b></span>
      </div>
      ${fmtRows?`<div class="pd-eyebrow pd-mini">Units per format</div><div class="pd-chs">${fmtRows}</div>`:''}
      ${perCh?`<div class="pd-eyebrow pd-mini">Assets per channel</div><div class="pd-chs">${perCh}</div>`:''}
      <div class="pd-total"><div class="pd-total-num">${ab.total||0}</div><div class="pd-total-lab">total assets</div></div>
      ${(p.deliverable_formats||[]).length?`<div class="pd-eyebrow pd-mini">Deliverable formats</div>${p.deliverable_formats.map(d=>`<p class="pd-body" style="margin-top:4px"><b>${escapeHtml(d.channel)}</b> — ${d.formats.map(f=>escapeHtml(f.name)+(f.size?' '+f.size:'')).join(', ')}</p>`).join('')}`:''}
      ${(()=>{ const tb=timeBreakdown(); if(!tb.formats.length||!tb.totalHours) return '';
        const rows=tb.formats.map(f=>`<div class="pd-ch"><span>${escapeHtml(f.label)}</span><span class="pd-ch-num">${fmtHrs(f.hours)}</span></div>`).join('')
          + (tb.extras||[]).map(e=>`<div class="pd-ch"><span>${escapeHtml(e.label)}${e.perVariation?` (${e.perVariation}m × ${e.count})`:''}</span><span class="pd-ch-num">+${fmtHrs(e.minutes/60)}</span></div>`).join('');
        return `<div class="pd-eyebrow pd-mini">Estimated production time</div><div class="pd-chs">${rows}</div>
        <p class="pd-body" style="margin-top:8px"><b>${fmtHrs(tb.totalHours)}</b> · ≈ ${(Math.round(tb.totalDays*10)/10).toFixed(1)} working days <span style="color:var(--chrome-dark-60)">— rough estimate, actual time will vary</span></p>`;
      })()}
    </div>`;
 
  const creativeList = (p.creative_required||[]).length
    ? `<div class="pd-tags">${p.creative_required.map(c=>{const o=CREATIVE.find(x=>x.value===c);return `<span class="pd-tag">${escapeHtml(o?o.label:c)}</span>`;}).join('')}</div>`
    : para('—');
 
  // per-format numbered list helper for the doc
  const perFormatList=(groups)=> groups.some(g=>g.items.some(i=>i&&i.trim()))
    ? groups.map(g=>{
        const lab=(CREATIVE.find(c=>c.value===g.format)||{}).label||g.format;
        const items=g.items.filter(i=>i&&i.trim());
        if(!items.length) return '';
        return `<div class="pd-eyebrow pd-mini">${escapeHtml(lab)}</div><ol class="pd-hooks">${items.map(i=>`<li>${nl2br(i)}</li>`).join('')}</ol>`;
      }).join('')
    : para('—');
 
  const versionsList = perFormatList(p.creative_breakdown.version_descriptions||[]);
  const hooks = perFormatList(p.messaging_hooks||[]);
  const additionalBlock = aiUgcSelected()
    ? (()=>{ const a=state.hooks||{}; if(!a.additional) return para('—');
        return a.additional==='Yes'
          ? `<p class="pd-body"><b>Additional information:</b> Yes</p><p class="pd-body">${a.additionalText?escapeHtml(String(a.additionalText).trim()).replace(/\n/g,'<br>'):'—'}</p>`
          : `<p class="pd-body"><b>Additional information:</b> No</p>`; })()
    : hooks;
 
  const scenesBlock = aiUgcSelected() ? scenePersonas().map((pp,i)=>{
    const arr=((state.creativeBreakdown&&state.creativeBreakdown.scenes)||[])[i]||[];
    const vc=variationCountForPersona(i);
    const nm=(pp!==null)?personaLabel(pp,i):'Scene';
    let vhtml='';
    for(let v=0; v<vc; v++){
      const sc=arr[v]||{};
      const setts=(sc.settings||[]).filter(x=>x&&String(x).trim());
      const fig=x=>`<figure><img src="${x.dataUrl}" alt=""><figcaption>${escapeHtml(x.name)}</figcaption></figure>`;
      const charIm=(sc.characterImages||[]).map(fig).join('');
      const setIm=(sc.settingImages||[]).map(fig).join('');
      const structure = structureText(sc) || '—';
      const charImgBlock = charIm ? `<p class="pd-body" style="margin-bottom:0"><b>Character reference image(s):</b></p><div class="pd-imgs">${charIm}</div>` : '';
      const setImgBlock = setIm ? `<p class="pd-body" style="margin-bottom:0"><b>Setting reference image(s):</b></p><div class="pd-imgs">${setIm}</div>` : '';
      const videoLine = (sc.videoRef&&sc.videoRef.trim()) ? `<p class="pd-body"><b>Video reference URL:</b> <a href="${escapeHtml(sc.videoRef.trim())}">${escapeHtml(sc.videoRef.trim())}</a></p>` : '';
      vhtml += `<div class="pd-var"><p class="pd-subh">Variation ${v+1}</p>
        <p class="pd-body"><b>Suggested hook:</b> ${nl2br(sc.hook)||'—'}</p>
        <p class="pd-body"><b>Character:</b> ${nl2br(sc.character)||'—'}</p>
        ${charImgBlock}
        <p class="pd-body"><b>Setting:</b> ${setts.length?escapeHtml(setts.join(', ')):'—'}</p>
        ${setImgBlock}
        <p class="pd-body"><b>Suggested script / talking points:</b><br>${nl2br(sc.script)||'—'}</p>
        <p class="pd-body"><b>UGC Ingredients:</b> ${nl2br(structure)||'—'}</p>
        ${videoLine}
        <p class="pd-body"><b>Duration:</b> ${escapeHtml(sc.duration||'—')}</p></div>`;
    }
    return `<div class="pd-eyebrow pd-mini">${escapeHtml(nm)}</div>${vhtml}`;
  }).join('') : '';
 
  const imgs = (p.creative_breakdown.images||[]).length
    ? `<div class="pd-imgs">${(state.creativeBreakdown.images||[]).map(im=>`<figure><img src="${im.dataUrl}" alt=""><figcaption>${escapeHtml(im.name)}</figcaption></figure>`).join('')}</div>`
    : '';
  const urlLine = p.creative_breakdown.reference_url
    ? `<p class="pd-url">Reference: ${escapeHtml(p.creative_breakdown.reference_url)}</p>` : '';
 
  return `
    <header class="pd-head">
      <div class="pd-logo">${LOGO_WHITE}</div>
      <div class="pd-eyebrow pd-eyebrow-light">Creative brief · Performance marketing</div>
      <h1 class="pd-title">${escapeHtml(p.project_title||'Untitled brief')}</h1>
      <div class="pd-meta">${meta}</div>
    </header>
    <div class="pd-body-wrap">
      ${p.persona.approach==='channel'
        ? sec('Channel considerations', para(p.persona.channel_considerations))
        : (p.persona.personas||[]).map((pers,idx,arr)=>sec(arr.length>1?('Persona '+(idx+1)):'Persona', `
            <p class="pd-subh">${escapeHtml(pers.title||'—')}</p>
            ${para(pers.description)}
            <div class="pd-eyebrow pd-mini">Motivator or pain points</div>${para(pers.motivator_or_pain)}
            <div class="pd-eyebrow pd-mini">Hypothesis</div>${para(pers.hypothesis)}
            <div class="pd-eyebrow pd-mini">Variables</div>${para(pers.variables)}`)).join('')}
      ${sec('Creative', creativeList)}
      ${sec('Production', production)}
      ${sec('Creative breakdown', aiUgcSelected() ? scenesBlock : (versionsList+urlLine+imgs), 'pd-sec-flow')}
      ${sec(aiUgcSelected()?'Additional information':'Messaging, hooks &amp; elements', additionalBlock)}
      ${aiUgcSelected() ? sec('Weave brief', (()=>{ const blks=buildWeaveBrief(); if(!blks.length) return para('—'); return `<p class="pd-body">One block per ad — copy each block separately into the Planner.</p>`+blks.map(t=>`<div class="weave-block"><button type="button" class="weave-copy no-print">Copy block</button><pre class="weave-pre">${escapeHtml(t)}</pre></div>`).join(''); })(), 'pd-sec-flow') : ''}
    </div>
    <footer class="pd-foot">
      <div class="pd-foot-logo">${LOGO_DARK}</div>
      <div class="pd-foot-date">Generated ${formatDate(new Date().toISOString().slice(0,10))} · Builder ${APP_VERSION}</div>
    </footer>`;
}
 
function openPreview(){
  document.getElementById('printDoc').innerHTML=buildBriefDoc();
  document.querySelectorAll('#printDoc .weave-copy').forEach(function(btn){ btn.onclick=function(){ copyWeaveBlock(btn); }; });
  document.getElementById('previewWrap').classList.add('show');
  document.getElementById('previewWrap').scrollTop=0;
}
function boot(){
  var av=document.getElementById('appVer'); if(av) av.textContent=APP_VERSION;
  var pb=document.getElementById('pBack'); if(pb) pb.onclick=function(){ document.getElementById('previewWrap').classList.remove('show'); };
  var ppt=document.getElementById('pPrintText'); if(ppt) ppt.onclick=function(){
    var slug=(state.title||'creative-brief').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'creative-brief';
    var prev=document.title; document.title=slug;
    var restore=function(){ document.title=prev; window.removeEventListener('afterprint',restore); };
    window.addEventListener('afterprint',restore);
    window.print();
  };
  var pp=document.getElementById('pPrint'); if(pp) pp.onclick=function(){
    var slug=(state.title||'creative-brief').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'creative-brief';
    var el=document.getElementById('printDoc');
    var st=document.getElementById('pStatus'); var setSt=function(m){ if(st) st.textContent=m||''; };
    var JsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
    if(typeof html2canvas==='undefined' || !JsPDF){
      var prev=document.title; document.title=slug;
      var restore=function(){ document.title=prev; window.removeEventListener('afterprint',restore); };
      window.addEventListener('afterprint',restore); window.print(); return;
    }
    var old=pp.textContent; pp.textContent='Generating…'; pp.disabled=true; setSt('');
    var done=function(){ pp.textContent=old; pp.disabled=false; };
    Promise.resolve((document.fonts&&document.fonts.ready)||null).then(function(){
      return html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:el.scrollWidth});
    }).then(function(canvas){
      var pdf=new JsPDF({unit:'pt',format:'a4'});
      var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
      var iw=pw, ih=canvas.height*(pw/canvas.width);
      var img=canvas.toDataURL('image/jpeg',0.92);
      pdf.addImage(img,'JPEG',0,0,iw,ih);
      var rem=ih-ph, y=0;
      while(rem>0){ pdf.addPage(); y-=ph; pdf.addImage(img,'JPEG',0,y,iw,ih); rem-=ph; }
      pdf.save(slug+'.pdf');
      if(st){ st.style.color='#1a8f4c'; st.textContent='Downloaded \u2713'; setTimeout(function(){ if(st.textContent==='Downloaded \u2713') st.textContent=''; },4000); }
      done();
    }).catch(function(e){ done(); if(st){ st.style.color='#b00020'; } setSt('Couldn’t build PDF: '+(e&&e.message||e)); });
  };
  rerender();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
