<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Hub — deployment test</title>
  <style>
    :root {
      --quantum-blue: #0086ff;
      --ink: #0a0e14;
      --muted: #5b6472;
      --line: #e6e9ef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--ink);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #11161f;
      border: 1px solid #1c2430;
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }
    .mark {
      width: 56px; height: 56px;
      margin: 0 auto 28px;
      border-radius: 12px;
      background: var(--quantum-blue);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 26px; color: #fff;
    }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--quantum-blue); margin-bottom: 18px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--quantum-blue);
      box-shadow: 0 0 0 0 rgba(0,134,255,.6);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,134,255,.6); }
      70% { box-shadow: 0 0 0 10px rgba(0,134,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,134,255,0); }
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { color: #9aa4b2; font-size: 15px; line-height: 1.6; }
    .meta {
      margin-top: 28px; padding-top: 24px; border-top: 1px solid #1c2430;
      font-size: 13px; color: #6b7484;
    }
    .meta strong { color: #c7cfda; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Q</div>
    <div class="status"><span class="dot"></span> Deployment live</div>
    <h1>Creative Hub test page</h1>
    <p>If you can see this, the site is building and serving correctly on Coolify. This is a placeholder — the real Hub replaces it next.</p>
    <div class="meta">
      Served as a static site &middot; <strong id="ts">loading…</strong>
    </div>
  </main>
  <script>
    document.getElementById('ts').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
